<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mini Drive - Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<!-- ==========================
     NAVBAR
     ========================== -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <!-- Brand -->

        <a class="navbar-brand fw-bold text-primary"
           href="dashboard.html">

            Mini Drive

        </a>


        <!-- Mobile menu button -->

        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Navbar content -->

        <div
                class="collapse navbar-collapse"
                id="navbarContent">

            <!-- Left side -->

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">

                    <a
                            class="nav-link active"
                            href="dashboard.html">

                        Home

                    </a>

                </li>

                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="#">

                        My Files

                    </a>

                </li>

                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="#">

                        Profile

                    </a>

                </li>

            </ul>


            <!-- Right side -->

            <button
                    id="logout"
                    class="btn btn-outline-danger">

                Logout

            </button>

        </div>

    </div>

</nav>


<!-- ==========================
     MAIN CONTENT
     ========================== -->

<main class="container py-5">

    <!-- Welcome section -->

    <div class="mb-5">

        <h1 class="fw-bold">

            Welcome to Mini Drive

        </h1>

        <p
                id="user"
                class="text-muted fs-5">

            Loading...

        </p>

    </div>


    <!-- Dashboard cards -->

    <div class="row g-4">


        <!-- My Files -->

        <div class="col-md-4">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body p-4">

                    <div class="mb-3">

                        <span
                                class="badge text-bg-primary">

                            Files

                        </span>

                    </div>

                    <h4 class="card-title">

                        My Files

                    </h4>

                    <p class="card-text text-muted">

                        View and manage all your
                        uploaded files.

                    </p>

                    <button
                            class="btn btn-primary">

                        View Files

                    </button>

                </div>

            </div>

        </div>


        <!-- Upload -->

        <div class="col-md-4">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body p-4">

                    <div class="mb-3">

                        <span
                                class="badge text-bg-success">

                            Upload

                        </span>

                    </div>

                    <h4 class="card-title">

                        Upload File

                    </h4>

                    <p class="card-text text-muted">

                        Upload documents and images
                        to your Mini Drive.

                    </p>

                    <button
                            class="btn btn-success">

                        Upload File

                    </button>

                </div>

            </div>

        </div>


        <!-- URL Shortener -->

        <div class="col-md-4">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body p-4">

                    <div class="mb-3">

                        <span
                                class="badge text-bg-warning">

                            URL

                        </span>

                    </div>

                    <h4 class="card-title">

                        URL Shortener

                    </h4>

                    <p class="card-text text-muted">

                        Create short URLs for
                        your files.

                    </p>

                    <button
                            class="btn btn-warning">

                        Shorten URL

                    </button>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- ==========================
     BOOTSTRAP JS
     ========================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Your authentication JavaScript -->

<script src="js/auth.js"></script>


<!-- ==========================
     LOAD CURRENT USER
     ========================== -->

<script>

    async function loadUser() {

        try {

            const response = await fetch(
                "/api/auth/me",
                {
                    credentials: "include"
                }
            );


            // User is not logged in

            if (!response.ok) {

                window.location.href =
                    "login.html";

                return;
            }


            // Get email from backend

            const email =
                await response.text();


            // Display email

            document.getElementById("user")
                .textContent =
                "Logged in as: " + email;

        }

        catch (error) {

            console.error(
                "Error loading user:",
                error
            );

            window.location.href =
                "login.html";
        }
    }


    loadUser();

</script>
<script src="js/auth.js"></script>
</body>

</html>
