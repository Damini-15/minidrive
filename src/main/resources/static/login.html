<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Drive - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Mini Drive</h1>

        <h2>Login</h2>

        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter email"
                        required>

            </div>

            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter password"
                        required>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

        <p class="switch">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
